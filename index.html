<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="review">
      <h2 class="result">Your Result</h2>
      <div class="circle">
        <h1 class="score"> 76 </h1>
        <h4 class="percent">of 100</h4>
      </div>
      <h1 class="remark">Great</h1>
      <p class="p">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
  
    <div class="sum">
      <h2 class="summary">Summary</h2>

      <div class="boxs">

        <div class="box1">
          <img src="icon-reaction.svg" alt="icon" class="icon_1">
          <span class="s1">Reaction</span>
          <span class="s2">80</span> 
          <span class="s3">/ 100</span>
          
        </div>

        <div class="box2">
          <img src="icon-memory.svg" alt="icon" class="icon_2">
          <span class="b2a"> Memory</span>
          <span class="b2b"> 92 </span>
          <span class="b2c"> / 100</span>
        </div>

        <div class="box3">
          <img src="icon-verbal.svg" alt="icon" class="icon_3">
          <span class="b3a">Verbal</span>
          <span class="b3b">61</span>
          <span class="b3c"> / 100</span>
        </div>

        <div class="box4">
          <img src="icon-visual.svg" alt="icon" class="icon_4">
          <span class="b4a">Visual</span>
          <span class="b4b">72</span>
          <span class="b4c">/ 100</span>
        </div>

      </div>

       <div class="box5">
          <a href="#" class="go"> Continue</a>
        </div>


    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
